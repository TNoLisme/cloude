openapi: 3.1.0
info:
  title: Digital Banking Simulator API
  version: 2.0.0
  description: Educational simulator only. No real financial transactions.
servers:
  - url: http://localhost:8080/api/v1
    description: Local backend via proxy
  - url: /api/v1
    description: Same-origin deployment
security:
  - bearerAuth: []
paths:
  /auth/register/send-otp:
    post:
      operationId: sendRegistrationOtp
      tags: [Auth]
      security: []
      description: Send 6-digit registration OTP to phone number before submitting registration.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendOtpRequest' }
      responses:
        '200':
          description: OTP dispatched successfully
          content: { application/json: { schema: { $ref: '#/components/schemas/SendOtpResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /auth/register:
    post:
      operationId: registerCustomer
      tags: [Auth]
      security: []
      description: Self-service registration with verified phone OTP. Creates Customer and active default checking account immediately.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Customer and account created successfully
          content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      security: []
      description: Authenticate with registered phone number and password. Returns access token, HttpOnly refresh cookie, and isPinSet flag.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Authenticated; refresh token is HttpOnly cookie
          headers:
            Set-Cookie: { schema: { type: string }, description: HttpOnly refresh_token cookie }
          content: { application/json: { schema: { $ref: '#/components/schemas/LoginResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /auth/csrf:
    get:
      operationId: getCsrfToken
      tags: [Auth]
      security: []
      responses:
        '200': { description: CSRF token, content: { application/json: { schema: { $ref: '#/components/schemas/CsrfTokenResponse' } } } }

  /auth/refresh:
    post:
      operationId: refreshSession
      tags: [Auth]
      security: []
      description: Requires refresh cookie, credentials include, and X-CSRF-Token.
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '200':
          description: Access and refresh tokens rotated
          headers: { Set-Cookie: { schema: { type: string } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/AccessTokenResponse' } } }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }

  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      parameters: [{ $ref: '#/components/parameters/CsrfToken' }]
      responses:
        '204': { description: Refresh session revoked and cookie cleared }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }

  /auth/recover/initiate:
    post:
      operationId: initiateAccountRecovery
      tags: [Auth]
      security: []
      description: >-
        Request recovery OTP via chosen channel (SMS to registered phone or EMAIL to registered email).
        Anti-enumeration: always returns the same 200 body whether or not the identifier is registered;
        OTP is dispatched asynchronously only when a matching account exists, so response time does not reveal existence.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverInitiateRequest' }
      responses:
        '200':
          description: Generic response, identical for registered and unregistered identifiers
          content: { application/json: { schema: { $ref: '#/components/schemas/RecoverInitiateResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /auth/recover/confirm:
    post:
      operationId: confirmAccountRecovery
      tags: [Auth]
      security: []
      description: >-
        Validate single-use 6-digit OTP (TTL 120s) from chosen channel and set new password. Revokes all refresh tokens of the user (force logout on every device).
        Anti-enumeration: an unregistered identifier returns 400 OTP_INVALID, identical to a wrong OTP.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoverConfirmRequest' }
      responses:
        '200':
          description: Password reset successfully and active sessions revoked
          content: { application/json: { schema: { $ref: '#/components/schemas/MessageResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /customers/me:
    get:
      operationId: getCurrentCustomer
      tags: [Customer]
      description: Get caller profile including phone, email, and isPinSet flag.
      responses:
        '200': { description: Own profile, content: { application/json: { schema: { $ref: '#/components/schemas/CustomerProfile' } } } }
        '401': { $ref: '#/components/responses/ProblemResponse' }

  /customers/me/pin/setup:
    post:
      operationId: setupPin
      tags: [Customer]
      description: Mandatory first-login transaction PIN configuration (6 digits). Required before any transfer can be initiated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupPinRequest' }
      responses:
        '200': { description: Transaction PIN configured successfully }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }

  /customers/me/pin/change:
    post:
      operationId: changePin
      tags: [Customer]
      description: Change transaction PIN by providing valid current PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePinRequest' }
      responses:
        '200': { description: Transaction PIN changed successfully }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }

  /customers/me/pin/forgot/initiate:
    post:
      operationId: initiateForgotPin
      tags: [Customer]
      description: Send reset OTP to customer registered phone number to reset forgotten PIN.
      responses:
        '200':
          description: Reset OTP sent to registered phone number
          content: { application/json: { schema: { $ref: '#/components/schemas/SendOtpResponse' } } }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /customers/me/pin/forgot/confirm:
    post:
      operationId: confirmForgotPin
      tags: [Customer]
      description: Validate phone OTP and set new transaction PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ForgotPinConfirmRequest' }
      responses:
        '200': { description: Transaction PIN reset successfully }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }

  /operator/customers/send-otp:
    post:
      operationId: operatorSendCustomerOtp
      tags: [Operator]
      x-required-roles: [OPERATOR, ADMIN]
      description: Operator initiates customer creation at counter by triggering OTP to customer present phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorSendOtpRequest' }
      responses:
        '200':
          description: OTP sent to customer phone at counter
          content: { application/json: { schema: { $ref: '#/components/schemas/SendOtpResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /operator/customers:
    post:
      operationId: operatorCreateCustomer
      tags: [Operator]
      x-required-roles: [OPERATOR, ADMIN]
      description: Operator provisions customer and active account at counter with verified OTP and initial password. Customer must configure PIN on first login.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperatorCreateCustomerRequest' }
      responses:
        '201':
          description: Customer and account created at counter
          content: { application/json: { schema: { $ref: '#/components/schemas/RegistrationResponse' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
    get:
      operationId: operatorLookupCustomer
      tags: [Operator]
      x-required-roles: [OPERATOR, ADMIN]
      description: >-
        Exact-match customer lookup at counter. Exactly one of phone or email is required; unfiltered listing,
        partial match and wildcard are rejected with 400 VALIDATION_ERROR. Every lookup is audited and rate limited.
      parameters:
        - { name: phone, in: query, schema: { $ref: '#/components/schemas/PhoneNumber' } }
        - { name: email, in: query, schema: { $ref: '#/components/schemas/EmailAddress' } }
      responses:
        '200': { description: Matching customer with accounts, content: { application/json: { schema: { $ref: '#/components/schemas/OperatorCustomerView' } } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /accounts:
    get:
      operationId: listMyAccounts
      tags: [Accounts]
      responses:
        '200': { description: Customer-owned accounts, content: { application/json: { schema: { $ref: '#/components/schemas/AccountPage' } } }}
        '401': { $ref: '#/components/responses/ProblemResponse' }

  /accounts/{accountId}:
    get:
      operationId: getAccount
      tags: [Accounts]
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      responses:
        '200': { description: Account details, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } }}
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }

  /operator/accounts/{accountId}/seed-balance:
    post:
      operationId: seedAccountBalance
      tags: [Operator]
      x-required-roles: [OPERATOR, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/AccountId' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SeedBalanceRequest' } } }
      responses:
        '201': { description: Seed funds applied, headers: { Idempotency-Replayed: { schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SeedBalanceResponse' } } }}
        '200': { description: Original seed result replayed, headers: { Idempotency-Replayed: { schema: { type: boolean } } }, content: { application/json: { schema: { $ref: '#/components/schemas/SeedBalanceResponse' } } }}
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }

  /operator/accounts/{accountId}/block:
    post:
      operationId: blockAccount
      tags: [Operator]
      x-required-roles: [OPERATOR, ADMIN]
      description: >-
        Set account status ACTIVE -> BLOCKED. Blocked accounts cannot send or receive transfers or seed funds;
        pending AWAITING_OTP transfers involving it fail at confirm. Blocking an already BLOCKED account returns 200
        with current state and no new mutation. CLOSED account returns 409 ACCOUNT_NOT_ELIGIBLE. Audited with reason.
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccountStatusChangeRequest' } } }
      responses:
        '200': { description: Account is BLOCKED, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }

  /operator/accounts/{accountId}/unblock:
    post:
      operationId: unblockAccount
      tags: [Operator]
      x-required-roles: [OPERATOR, ADMIN]
      description: >-
        Set account status BLOCKED -> ACTIVE. Unblocking an already ACTIVE account returns 200 with current state
        and no new mutation. CLOSED account returns 409 ACCOUNT_NOT_ELIGIBLE. Audited with reason.
      parameters: [{ $ref: '#/components/parameters/AccountId' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AccountStatusChangeRequest' } } }
      responses:
        '200': { description: Account is ACTIVE, content: { application/json: { schema: { $ref: '#/components/schemas/Account' } } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }

  /recipients/resolve:
    post:
      operationId: resolveRecipient
      tags: [Transfers]
      description: Rate limited. Return same not-available code for nonexistent or ineligible accounts.
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ResolveRecipientRequest' } } }
      responses:
        '200': { description: Safe recipient confirmation, content: { application/json: { schema: { $ref: '#/components/schemas/RecipientConfirmation' } } }}
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }

  /transfers:
    post:
      operationId: createTransfer
      tags: [Transfers]
      description: >-
        Initiate internal transfer. Requires valid 6-digit transaction PIN. If amount <= 5,000,000 VND, commits immediately (201).
        If amount > 5,000,000 VND, creates transfer in AWAITING_OTP (no balance change, no funds reserved), sends phone OTP and
        returns challenge (200). Replay with same key + same payload returns the current state of the same logical transfer with
        Idempotency-Replayed true: the original challenge (remaining expiresInSeconds, no new OTP) while AWAITING_OTP, otherwise the Transfer.
        Challenge and transfer commit before OTP dispatch. Dispatch failure or timeout returns 503 SERVICE_UNAVAILABLE;
        compensation changes only AWAITING_OTP to FAILED with failureCode OTP_DISPATCH_FAILED and invalidates the challenge.
        Terminal states are never overwritten. Same-key replay returns current state without resending OTP.
        A crash before dispatch or compensation may leave AWAITING_OTP until expiry (best-effort delivery, no Outbox).
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/CreateTransferRequest' } } }
      responses:
        '201':
          description: Transfer committed (for amount <= 5,000,000 VND)
          headers: { Idempotency-Replayed: { schema: { type: boolean } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
        '200':
          description: Either challenge required (for amount > 5,000,000 VND) or idempotent replay of committed transfer
          headers: { Idempotency-Replayed: { schema: { type: boolean } } }
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/TransferChallengeResponse' }
                  - { $ref: '#/components/schemas/Transfer' }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }
        '429': { $ref: '#/components/responses/ProblemResponse' }
        '503': { $ref: '#/components/responses/ProblemResponse' }
    get:
      operationId: listTransfers
      tags: [Transfers]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TransferStatus' } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Instant' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Instant' } }
      responses:
        '200': { description: Transfer history page, content: { application/json: { schema: { $ref: '#/components/schemas/TransferPage' } } }}
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }

  /transfers/{transferId}:
    get:
      operationId: getTransfer
      tags: [Transfers]
      description: >-
        Read current transfer status (AWAITING_OTP, COMPLETED, EXPIRED, FAILED). Source owner sees every status;
        destination owner sees the transfer only once COMPLETED (otherwise 404 TRANSFER_NOT_FOUND).
        FE uses it to reconcile after timeout and to poll a pending step-up transfer.
      parameters: [{ $ref: '#/components/parameters/TransferId' }]
      responses:
        '200': { description: Transfer details, content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }}
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }

  /transfers/{transferId}/confirm-otp:
    post:
      operationId: confirmTransferOtp
      tags: [Transfers]
      description: >-
        Complete step-up transfer exceeding 5,000,000 VND by validating SMS OTP. Only the source-account owner may call it.
        Under account row locks the server re-validates account status, currency and available balance, then commits debit,
        credit, audit and status COMPLETED atomically. Idempotent by transferId (no Idempotency-Key header): calling again
        after COMPLETED returns 200 with the same Transfer and Idempotency-Replayed true, without a second mutation.
        Wrong OTP returns 400 OTP_INVALID; the 5th wrong OTP sets status FAILED. After 120s status becomes EXPIRED.
      parameters: [{ $ref: '#/components/parameters/TransferId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmTransferOtpRequest' }
      responses:
        '201':
          description: Transfer committed after valid OTP verification
          headers: { Idempotency-Replayed: { schema: { type: boolean } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
        '200':
          description: Already COMPLETED; original result replayed
          headers: { Idempotency-Replayed: { schema: { type: boolean } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/Transfer' } } }
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '404': { $ref: '#/components/responses/ProblemResponse' }
        '409': { $ref: '#/components/responses/ProblemResponse' }

  /audit-events:
    get:
      operationId: listAuditEvents
      tags: [Audit]
      x-required-roles: [AUDITOR, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: eventType, in: query, schema: { type: string, maxLength: 80 } }
        - { name: actorId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Instant' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Instant' } }
      responses:
        '200': { description: Audit event page, content: { application/json: { schema: { $ref: '#/components/schemas/AuditPage' } } }}
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }

  /operator/risk-flags:
    get:
      operationId: listRiskFlags
      tags: [Risk]
      x-required-roles: [OPERATOR, AUDITOR, ADMIN]
      parameters:
        - { $ref: '#/components/parameters/Limit' }
        - { $ref: '#/components/parameters/Cursor' }
        - { name: ruleId, in: query, schema: { type: string, maxLength: 80 } }
        - { name: transferId, in: query, schema: { $ref: '#/components/schemas/Uuid' } }
        - { name: from, in: query, schema: { $ref: '#/components/schemas/Instant' } }
        - { name: to, in: query, schema: { $ref: '#/components/schemas/Instant' } }
      responses:
        '200': { description: Risk flag list, content: { application/json: { schema: { $ref: '#/components/schemas/RiskFlagPage' } } }}
        '400': { $ref: '#/components/responses/ProblemResponse' }
        '401': { $ref: '#/components/responses/ProblemResponse' }
        '403': { $ref: '#/components/responses/ProblemResponse' }

  /health:
    get:
      operationId: getHealth
      tags: [System]
      security: []
      responses:
        '200': { description: System healthy, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }}
        '503': { description: System unhealthy, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } }}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CsrfToken: { name: X-CSRF-Token, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 256 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 16, maxLength: 128 } }
    AccountId: { name: accountId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    CustomerId: { name: customerId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    TransferId: { name: transferId, in: path, required: true, schema: { $ref: '#/components/schemas/Uuid' } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string, maxLength: 256 } }
  responses:
    ProblemResponse:
      description: RFC 9457-compatible error
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Uuid: { type: string, format: uuid }
    Instant: { type: string, format: date-time, description: RFC 3339 UTC timestamp emitted with Z suffix }
    PhoneNumber: { type: string, pattern: '^0[3-9][0-9]{8}$', examples: ['0912345678'], description: Unique 10-digit Vietnam phone number }
    EmailAddress: { type: string, format: email, maxLength: 254, description: Unique email address }
    MoneyAmount: { type: string, pattern: '^(0|[1-9][0-9]{0,14})$', examples: ['50000'], description: Simulated VND, integer only (scale 0) }
    Currency: { type: string, enum: [VND] }
    AccountStatus: { type: string, enum: [ACTIVE, BLOCKED, CLOSED] }
    Role: { type: string, enum: [CUSTOMER, OPERATOR, AUDITOR, ADMIN] }
    RecoveryChannel: { type: string, enum: [SMS, EMAIL] }

    SendOtpRequest:
      type: object
      additionalProperties: false
      required: [phone, purpose]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        purpose: { type: string, enum: [REGISTRATION, OPERATOR_CREATE_CUSTOMER] }

    SendOtpResponse:
      type: object
      required: [phone, expiresInSeconds, message]
      properties:
        phone: { type: string }
        expiresInSeconds: { type: integer, example: 120 }
        message: { type: string, example: "OTP sent successfully" }

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [phone, email, password, fullName, otp]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { $ref: '#/components/schemas/EmailAddress' }
        password: { type: string, minLength: 12, maxLength: 128, writeOnly: true }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        otp: { type: string, pattern: '^[0-9]{6}$', description: 6-digit OTP verified via SMS }
        address: { type: string, maxLength: 300 }

    RegistrationResponse:
      type: object
      required: [customerId, phone, email, fullName, account, createdAt]
      properties:
        customerId: { $ref: '#/components/schemas/Uuid' }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { $ref: '#/components/schemas/EmailAddress' }
        fullName: { type: string }
        account: { $ref: '#/components/schemas/Account' }
        createdAt: { $ref: '#/components/schemas/Instant' }

    OperatorSendOtpRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }

    OperatorCreateCustomerRequest:
      type: object
      additionalProperties: false
      required: [phone, email, fullName, initialPassword, otp]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { $ref: '#/components/schemas/EmailAddress' }
        fullName: { type: string, minLength: 1, maxLength: 120 }
        initialPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true, description: Initial password assigned by operator }
        otp: { type: string, pattern: '^[0-9]{6}$', description: 6-digit OTP confirmed by customer at counter }
        address: { type: string, maxLength: 300 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [phone, password]
      properties:
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        password: { type: string, minLength: 1, maxLength: 128, writeOnly: true }

    UserSummary:
      type: object
      required: [userId, customerId, displayName, phone, email, roles, isPinSet]
      properties:
        userId: { $ref: '#/components/schemas/Uuid' }
        customerId: { $ref: '#/components/schemas/Uuid' }
        displayName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { $ref: '#/components/schemas/EmailAddress' }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' } }
        isPinSet: { type: boolean, description: Indicates if transaction PIN is already configured }

    AccessTokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 1 }

    LoginResponse:
      allOf:
        - { $ref: '#/components/schemas/AccessTokenResponse' }
        - type: object
          required: [user]
          properties: { user: { $ref: '#/components/schemas/UserSummary' } }

    CsrfTokenResponse:
      type: object
      required: [csrfToken]
      properties: { csrfToken: { type: string, minLength: 16, maxLength: 256 } }

    CustomerProfile:
      type: object
      required: [customerId, fullName, phone, email, isPinSet, createdAt]
      properties:
        customerId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { $ref: '#/components/schemas/EmailAddress' }
        isPinSet: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Instant' }

    RecoverInitiateRequest:
      type: object
      additionalProperties: false
      required: [identifier, channel]
      properties:
        identifier: { type: string, description: Registered phone number or email address }
        channel: { $ref: '#/components/schemas/RecoveryChannel' }

    RecoverInitiateResponse:
      type: object
      required: [identifier, channel, expiresInSeconds, message]
      properties:
        identifier: { type: string }
        channel: { $ref: '#/components/schemas/RecoveryChannel' }
        expiresInSeconds: { type: integer, example: 120 }
        message: { type: string, example: "If the information is registered, an OTP has been sent to the selected channel." }

    MessageResponse:
      type: object
      required: [message]
      properties:
        message: { type: string, example: "Password reset successfully and active sessions revoked" }

    RecoverConfirmRequest:
      type: object
      additionalProperties: false
      required: [identifier, channel, otp, newPassword]
      properties:
        identifier: { type: string }
        channel: { $ref: '#/components/schemas/RecoveryChannel' }
        otp: { type: string, pattern: '^[0-9]{6}$' }
        newPassword: { type: string, minLength: 12, maxLength: 128, writeOnly: true }

    SetupPinRequest:
      type: object
      additionalProperties: false
      required: [pin, confirmPin]
      properties:
        pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: 6-digit transaction PIN }
        confirmPin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }

    ChangePinRequest:
      type: object
      additionalProperties: false
      required: [currentPin, newPin, confirmNewPin]
      properties:
        currentPin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
        newPin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
        confirmNewPin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }

    ForgotPinConfirmRequest:
      type: object
      additionalProperties: false
      required: [otp, newPin, confirmNewPin]
      properties:
        otp: { type: string, pattern: '^[0-9]{6}$', description: 6-digit OTP sent to registered phone }
        newPin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
        confirmNewPin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }

    Account:
      type: object
      required: [accountId, accountNumberMasked, accountType, status, balance, currency, openedAt]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        accountNumberMasked: { type: string }
        accountType: { type: string, enum: [CHECKING] }
        status: { $ref: '#/components/schemas/AccountStatus' }
        balance: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        openedAt: { $ref: '#/components/schemas/Instant' }

    AccountPage:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/Account' } } }

    AccountStatusChangeRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: { type: string, minLength: 1, maxLength: 500 }

    OperatorCustomerView:
      type: object
      required: [customerId, fullName, phone, email, isPinSet, createdAt, accounts]
      properties:
        customerId: { $ref: '#/components/schemas/Uuid' }
        fullName: { type: string }
        phone: { $ref: '#/components/schemas/PhoneNumber' }
        email: { $ref: '#/components/schemas/EmailAddress' }
        isPinSet: { type: boolean }
        createdAt: { $ref: '#/components/schemas/Instant' }
        accounts: { type: array, items: { $ref: '#/components/schemas/Account' } }

    ResolveRecipientRequest:
      type: object
      additionalProperties: false
      required: [accountNumber]
      properties: { accountNumber: { type: string, minLength: 8, maxLength: 34, pattern: '^[0-9]+$' } }

    RecipientConfirmation:
      type: object
      required: [accountId, accountNumberMasked, recipientDisplayName, currency]
      properties:
        accountId: { $ref: '#/components/schemas/Uuid' }
        accountNumberMasked: { type: string }
        recipientDisplayName: { type: string, maxLength: 120 }
        currency: { $ref: '#/components/schemas/Currency' }

    SeedBalanceRequest:
      type: object
      additionalProperties: false
      required: [amount, currency, reference]
      properties:
        amount: { type: string, pattern: '^(?:[1-9][0-9]{0,7}|100000000)$', description: Greater than zero and at most 100000000 VNĐ; integer only (scale 0) }
        currency: { $ref: '#/components/schemas/Currency' }
        reference: { type: string, minLength: 1, maxLength: 100 }

    SeedBalanceResponse:
      type: object
      required: [seedTransactionId, accountId, amount, currency, balanceAfter, createdAt]
      properties:
        seedTransactionId: { $ref: '#/components/schemas/Uuid' }
        accountId: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        balanceAfter: { $ref: '#/components/schemas/MoneyAmount' }
        createdAt: { $ref: '#/components/schemas/Instant' }

    CreateTransferRequest:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destinationAccountId, amount, currency, pin]
      properties:
        sourceAccountId: { $ref: '#/components/schemas/Uuid' }
        destinationAccountId: { $ref: '#/components/schemas/Uuid' }
        amount: { type: string, pattern: '^(?:[2-9][0-9]{3}|[1-9][0-9]{4,6}|10000000)$', description: At least 2000 VNĐ and at most 10000000 VNĐ; integer only (scale 0) }
        currency: { $ref: '#/components/schemas/Currency' }
        pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true, description: 6-digit transaction PIN }
        memo: { type: string, maxLength: 140 }

    TransferChallengeResponse:
      type: object
      required: [transferId, status, message, expiresInSeconds]
      properties:
        transferId: { $ref: '#/components/schemas/Uuid' }
        status: { type: string, enum: [AWAITING_OTP] }
        expiresAt: { $ref: '#/components/schemas/Instant' }
        message: { type: string, example: "Transfer exceeds 5,000,000 VND. OTP sent to registered phone number." }
        expiresInSeconds: { type: integer, example: 120 }

    ConfirmTransferOtpRequest:
      type: object
      additionalProperties: false
      required: [otp]
      properties:
        otp: { type: string, pattern: '^[0-9]{6}$', description: 6-digit OTP sent to registered phone number }

    TransferStatus:
      type: string
      enum: [AWAITING_OTP, COMPLETED, EXPIRED, FAILED]
      description: >-
        AWAITING_OTP -> COMPLETED (valid OTP) | EXPIRED (120s elapsed) | FAILED (5 wrong OTP, re-validation failed at confirm, or OTP dispatch failed).
        Transfers <= 5,000,000 VND are created directly as COMPLETED. Only COMPLETED changes balances. Terminal states never change.

    Transfer:
      type: object
      required: [transferId, status, sourceAccountId, destinationAccountId, amount, currency, createdAt]
      properties:
        transferId: { $ref: '#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/TransferStatus' }
        failureCode: { type: string, description: 'Present only when FAILED, e.g. OTP_ATTEMPTS_EXCEEDED, INSUFFICIENT_FUNDS, ACCOUNT_NOT_ELIGIBLE, OTP_DISPATCH_FAILED' }
        expiresAt: { $ref: '#/components/schemas/Instant', description: Present while AWAITING_OTP }
        sourceAccountId: { $ref: '#/components/schemas/Uuid' }
        destinationAccountId: { $ref: '#/components/schemas/Uuid' }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        memo: { type: string, maxLength: 140 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        completedAt: { $ref: '#/components/schemas/Instant', description: Present only when COMPLETED }

    TransferListItem:
      type: object
      required: [transferId, direction, status, counterpartyAccountMasked, counterpartyDisplayName, amount, currency, createdAt]
      properties:
        transferId: { $ref: '#/components/schemas/Uuid' }
        direction: { type: string, enum: [INCOMING, OUTGOING] }
        status: { $ref: '#/components/schemas/TransferStatus' }
        counterpartyAccountMasked: { type: string }
        counterpartyDisplayName: { type: string, maxLength: 120, description: Limited display name; must not include contact details }
        amount: { $ref: '#/components/schemas/MoneyAmount' }
        currency: { $ref: '#/components/schemas/Currency' }
        memo: { type: string, maxLength: 140 }
        createdAt: { $ref: '#/components/schemas/Instant' }
        completedAt: { $ref: '#/components/schemas/Instant' }

    TransferPage:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/TransferListItem' } } }

    AuditEvent:
      type: object
      required: [eventId, eventType, targetType, targetId, outcome, occurredAt, correlationId, summary]
      properties:
        eventId: { $ref: '#/components/schemas/Uuid' }
        eventType: { type: string }
        actorId: { $ref: '#/components/schemas/Uuid' }
        targetType: { type: string }
        targetId: { $ref: '#/components/schemas/Uuid' }
        outcome: { type: string, enum: [SUCCESS, FAILURE] }
        occurredAt: { $ref: '#/components/schemas/Instant' }
        correlationId: { $ref: '#/components/schemas/Uuid' }
        summary: { type: string, maxLength: 500 }

    AuditPage:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } } }

    RiskFlag:
      type: object
      required: [flagId, transferId, ruleId, ruleVersion, reason, detectedAt]
      properties:
        flagId: { $ref: '#/components/schemas/Uuid' }
        transferId: { $ref: '#/components/schemas/Uuid' }
        ruleId: { type: string }
        ruleVersion: { type: string }
        reason: { type: string, maxLength: 500 }
        detectedAt: { $ref: '#/components/schemas/Instant' }

    RiskFlagPage:
      allOf:
        - { $ref: '#/components/schemas/PageBase' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/RiskFlag' } } }

    PageBase:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, 'null'] }

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    Problem:
      type: object
      required: [type, title, status, detail, instance, code, correlationId]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        code: { type: string }
        correlationId: { $ref: '#/components/schemas/Uuid' }
        fieldErrors: { type: array, items: { $ref: '#/components/schemas/FieldError' } }

    Health:
      type: object
      required: [status, timestamp]
      properties:
        status: { type: string, enum: [UP, DOWN] }
        timestamp: { $ref: '#/components/schemas/Instant' }
