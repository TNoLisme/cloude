services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: digitalbanking-backend:0.1.0-SNAPSHOT
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      SERVER_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: digital_banking
      DB_URL: jdbc:postgresql://postgres:5432/digital_banking?currentSchema=banking
      DB_APP_USER: ${DB_APP_USER:-banking_app}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:-local_app_password}
      DB_MIGRATION_USER: ${DB_MIGRATION_USER:-banking_migrator}
      DB_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-local_migration_password}
      APP_VERSION: ${APP_VERSION:-dev}
    ports:
      - 127.0.0.1:${BACKEND_PORT:-18080}:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - banking-net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: digital_banking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-local_postgres_password}
      BANKING_APP_PASSWORD: ${DB_APP_PASSWORD:-local_app_password}
      BANKING_MIGRATION_PASSWORD: ${DB_MIGRATION_PASSWORD:-local_migration_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digital_banking"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - banking-net

volumes:
  postgres-data:

networks:
  banking-net:
    driver: bridge
