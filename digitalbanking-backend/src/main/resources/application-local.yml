spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_banking}?currentSchema=banking
    username: ${DB_APP_USER:banking_app}
    password: ${DB_APP_PASSWORD:local_app_password}
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:digital_banking}?currentSchema=banking
    user: ${DB_MIGRATION_USER:banking_migrator}
    password: ${DB_MIGRATION_PASSWORD:local_migration_password}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  crypto:
    aes-key-base64: ${APP_PII_AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
    hmac-key-base64: ${APP_HMAC_KEY_BASE64:MTEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
