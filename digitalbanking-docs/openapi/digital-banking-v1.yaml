components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: DB_SESSION
      description: Opaque session cookie; HttpOnly, Secure, SameSite=Strict
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Cùng token opaque với session cookie, dùng cho API client/test
  parameters:
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Trace ID; server sinh mới nếu thiếu
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,64}$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bắt buộc cho POST /transfers; 1-255 ký tự, không chứa PII
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[A-Za-z0-9._:~-]{1,255}$'
    StepUpChallenge:
      name: X-Step-Up-Challenge
      in: header
      required: false
      description: challengeId đã VERIFIED; bắt buộc sau 428 cho hành động nhạy cảm
      schema:
        type: string
        format: uuid
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Bắt buộc với cookie session cho request thay đổi dữ liệu
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: Trang 0-based
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: 'field,asc|desc; field thuộc whitelist từng endpoint'
      schema:
        type: string
    FromQuery:
      name: from
      in: query
      required: false
      description: Inclusive; mặc định now-30d
      schema:
        $ref: '#/components/schemas/Instant'
    ToQuery:
      name: to
      in: query
      required: false
      description: Exclusive; mặc định now
      schema:
        $ref: '#/components/schemas/Instant'
    CustomerIdQuery:
      name: customerId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ID'
    AccountIdQuery:
      name: accountId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ID'
    TransferStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/TransferStatus'
    DirectionQuery:
      name: direction
      in: query
      required: false
      description: Yêu cầu accountId
      schema:
        $ref: '#/components/schemas/Direction'
    MinAmountQuery:
      name: minAmount
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Money'
    MaxAmountQuery:
      name: maxAmount
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Money'
    CorrelationIdQuery:
      name: correlationId
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    ReferenceQuery:
      name: reference
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/Reference'
    ActorUserIdQuery:
      name: actorUserId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ID'
    ActorTypeQuery:
      name: actorType
      in: query
      required: false
      schema:
        type: string
        enum: [USER, SYSTEM]
    ActionQuery:
      name: action
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    EntityTypeQuery:
      name: entityType
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    EntityIdQuery:
      name: entityId
      in: query
      required: false
      schema:
        type: string
        maxLength: 64
    OutcomeQuery:
      name: outcome
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/AuditOutcome'
    FraudFlagStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FraudFlagStatus'
    SeverityQuery:
      name: severity
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/FraudSeverity'
    RuleCodeQuery:
      name: ruleCode
      in: query
      required: false
      schema:
        type: string
        maxLength: 32
    RequestTypeQuery:
      name: requestType
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApprovalRequestType'
    ApprovalStatusQuery:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ApprovalStatus'
    MakerIdQuery:
      name: makerId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ID'
    CheckerIdQuery:
      name: checkerId
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/ID'
    AccountIdPath:
      name: accountId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    CustomerIdPath:
      name: customerId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    ReferencePath:
      name: reference
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Reference'
    ChallengeIdPath:
      name: challengeId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UUID'
    AuditIdPath:
      name: auditId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
    FraudFlagIdPath:
      name: id
      in: path
      required: true
      description: flagId
      schema:
        $ref: '#/components/schemas/ID'
    LimitApprovalIdPath:
      name: id
      in: path
      required: true
      description: approvalId của LIMIT_CHANGE
      schema:
        $ref: '#/components/schemas/ID'
    RoleApprovalIdPath:
      name: id
      in: path
      required: true
      description: approvalId của ROLE_CHANGE
      schema:
        $ref: '#/components/schemas/ID'
    ApprovalIdPath:
      name: approvalId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ID'
  headers:
    XCorrelationId:
      description: Trace ID của request
      schema:
        type: string
        maxLength: 64
    SetCookie:
      description: 'DB_SESSION cookie hoặc xóa cookie khi logout'
      schema:
        type: string
    Location:
      description: URI của resource vừa tạo
      schema:
        type: string
        format: uri-reference
    IdempotentReplayed:
      description: 'true nếu response được replay từ idempotency record'
      schema:
        type: string
        enum: ['true']
    RetryAfter:
      description: Số giây chờ trước khi retry
      schema:
        type: integer
        minimum: 0
    WWWAuthenticate:
      description: Challenge cho Bearer auth
      schema:
        type: string
    ContentDisposition:
      description: Tên file export
      schema:
        type: string
  responses:
    BadRequest:
      description: Dữ liệu/header/query không hợp lệ
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            validation:
              $ref: '#/components/examples/ValidationErrorExample'
    Unauthorized:
      description: Chưa xác thực hoặc session hết hạn
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
        WWW-Authenticate:
          $ref: '#/components/headers/WWWAuthenticate'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unauthorized:
              $ref: '#/components/examples/UnauthorizedExample'
    Forbidden:
      description: Không đủ quyền/CSRF sai/ngoài scope
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            forbidden:
              $ref: '#/components/examples/ForbiddenExample'
    NotFound:
      description: Resource không tồn tại
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            notFound:
              $ref: '#/components/examples/NotFoundExample'
    Conflict:
      description: Xung đột trạng thái/idempotency/role
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            conflict:
              $ref: '#/components/examples/ConflictExample'
    Gone:
      description: Challenge/OTP đã hết hạn
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            gone:
              $ref: '#/components/examples/GoneExample'
    PayloadTooLarge:
      description: Body/export vượt giới hạn
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: Content-Type không hỗ trợ
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Vi phạm business rule
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientBalance:
              $ref: '#/components/examples/InsufficientBalanceExample'
            transferFailed:
              $ref: '#/components/examples/TransferFailedExample'
    Locked:
      description: Tài khoản/challenge bị khóa
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StepUpRequired:
      description: Cần xác thực bổ sung
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/StepUpProblem'
          examples:
            stepUp:
              $ref: '#/components/examples/StepUpRequiredExample'
    TooManyRequests:
      description: Vượt rate limit
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            rateLimited:
              $ref: '#/components/examples/RateLimitedExample'
    InternalServerError:
      description: Lỗi nội bộ
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            internal:
              $ref: '#/components/examples/InternalErrorExample'
    ServiceUnavailable:
      description: Dịch vụ tạm thời không khả dụng
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            unavailable:
              $ref: '#/components/examples/ServiceUnavailableExample'
    GatewayTimeout:
      description: Gateway/provider timeout
      headers:
        X-Correlation-ID:
          $ref: '#/components/headers/XCorrelationId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ID:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
    UUID:
      type: string
      format: uuid
    Money:
      type: string
      pattern: '^(0|[1-9][0-9]{0,16})\.[0-9]{2}$'
    Currency:
      type: string
      enum: [VND]
    Instant:
      type: string
      format: date-time
    LocalDate:
      type: string
      format: date
    Reference:
      type: string
      minLength: 16
      maxLength: 32
      pattern: '^TXN[0-9]{8}[A-Z0-9]{8,20}$'
    RoleCode:
      type: string
      enum: [CUSTOMER, OPERATIONS, ADMIN, AUDITOR]
    PrivilegeCode:
      type: string
      enum: [CHECKER]
    UserType:
      type: string
      enum: [CUSTOMER, STAFF]
    AccountStatus:
      type: string
      enum: [ACTIVE, LOCKED, CLOSED]
    CustomerStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    TransferStatus:
      type: string
      enum: [PENDING, COMPLETED, FAILED]
    Direction:
      type: string
      enum: [DEBIT, CREDIT, INTERNAL]
    TransferFailureCode:
      type: string
      enum:
        - INSUFFICIENT_BALANCE
        - LIMIT_EXCEEDED
        - ACCOUNT_INACTIVE
        - ACCOUNT_NOT_FOUND
        - FRAUD_BLOCKED
        - OTP_DISPATCH_FAILED
        - AUDIT_WRITE_FAILED
        - INVALID_STATE_TRANSITION
        - PROCESSING_ERROR
    ChallengePurpose:
      type: string
      enum: [LOGIN_NEW_DEVICE, TRANSFER_STEP_UP, SENSITIVE_ACTION]
    ChallengeMethod:
      type: string
      enum: [OTP, FIDO, PASSCODE]
    ChallengeChannel:
      type: [string, 'null']
      enum: [SMS, EMAIL, IN_APP, null]
    FraudSeverity:
      type: string
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    FraudFlagStatus:
      type: string
      enum: [OPEN, UNDER_REVIEW, ALLOWED, BLOCKED, CLOSED]
    FraudDecision:
      type: string
      enum: [ALLOW, BLOCK, ESCALATE, CLOSE]
    ApprovalRequestType:
      type: string
      enum: [LIMIT_CHANGE, ROLE_CHANGE]
    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, APPLIED, CANCELLED]
    ApprovalTargetType:
      type: string
      enum: [CUSTOMER, ACCOUNT, APP_USER]
    AuditOutcome:
      type: string
      enum: [SUCCESS, FAILURE, REJECTED]
    AuditActorType:
      type: string
      enum: [USER, SYSTEM]
    ErrorCode:
      type: string
      enum:
        - AUTH_INVALID_CREDENTIALS
        - AUTH_ACCOUNT_LOCKED
        - AUTH_SESSION_EXPIRED
        - AUTH_FORBIDDEN
        - AUTH_DEVICE_NOT_TRUSTED
        - AUTH_CHALLENGE_NOT_FOUND
        - AUTH_CHALLENGE_EXPIRED
        - AUTH_CHALLENGE_LOCKED
        - AUTH_OTP_INVALID
        - AUTH_OTP_EXPIRED
        - STEP_UP_REQUIRED
        - STEP_UP_CHALLENGE_MISMATCH
        - OTP_DISPATCH_FAILED
        - VALIDATION_ERROR
        - MALFORMED_REQUEST
        - UNSUPPORTED_MEDIA_TYPE
        - REQUEST_TOO_LARGE
        - METHOD_NOT_ALLOWED
        - NOT_FOUND
        - RATE_LIMITED
        - ACCOUNT_NOT_FOUND
        - ACCOUNT_INACTIVE
        - INSUFFICIENT_BALANCE
        - LIMIT_EXCEEDED
        - LIMIT_OUT_OF_POLICY
        - TRANSFER_NOT_FOUND
        - TRANSFER_FAILED
        - FRAUD_BLOCKED
        - FRAUD_FLAG_NOT_FOUND
        - FRAUD_FLAG_ALREADY_CLOSED
        - INVALID_STATE_TRANSITION
        - CUSTOMER_NOT_FOUND
        - AUDIT_NOT_FOUND
        - EXPORT_TOO_LARGE
        - IDEMPOTENCY_CONFLICT
        - IDEMPOTENCY_IN_PROGRESS
        - APPROVAL_NOT_FOUND
        - APPROVAL_ALREADY_DECIDED
        - ROLE_CONFLICT
        - ROLE_NOT_FOUND
        - USER_NOT_FOUND
        - LEGAL_HOLD_ACTIVE
        - AUDIT_WRITE_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - GATEWAY_TIMEOUT
    Problem:
      type: object
      additionalProperties: true
      required:
        - type
        - title
        - status
        - detail
        - instance
        - code
        - correlationId
        - timestamp
        - retryable
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          $ref: '#/components/schemas/ErrorCode'
        correlationId:
          type: string
        timestamp:
          $ref: '#/components/schemas/Instant'
        retryable:
          type: boolean
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
        challenge:
          $ref: '#/components/schemas/Challenge'
        reference:
          $ref: '#/components/schemas/Reference'
        transferStatus:
          $ref: '#/components/schemas/TransferStatus'
        failureCode:
          $ref: '#/components/schemas/TransferFailureCode'
        lockedUntil:
          $ref: '#/components/schemas/Instant'
    ValidationErrorItem:
      type: object
      required: [field, code, message]
      properties:
        field:
          type: string
        code:
          type: string
        message:
          type: string
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [errors]
          properties:
            errors:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ValidationErrorItem'
    StepUpProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [challenge]
          properties:
            challenge:
              $ref: '#/components/schemas/Challenge'
    Challenge:
      type: object
      required: [challengeId, purpose, methods, expiresAt, maxAttempts, remainingAttempts]
      properties:
        challengeId:
          $ref: '#/components/schemas/UUID'
        purpose:
          $ref: '#/components/schemas/ChallengePurpose'
        methods:
          type: array
          minItems: 1
          description: >-
            Danh sách phương thức chính sách cho phép. Trong MVP, challengeId
            gắn với một method cụ thể; methods không ngụ ý nhiều method trên
            cùng một challenge (OI-API-17).
          items:
            $ref: '#/components/schemas/ChallengeMethod'
        channel:
          $ref: '#/components/schemas/ChallengeChannel'
        maskedDestination:
          type: [string, 'null']
        expiresAt:
          $ref: '#/components/schemas/Instant'
        maxAttempts:
          type: integer
          minimum: 1
        remainingAttempts:
          type: integer
          minimum: 0
        fidoRequestOptions:
          type: [object, 'null']
          additionalProperties: true
          description: WebAuthn request options khi methods có FIDO
    ChallengeRequiredResponse:
      type: object
      required: [code, message, challenge, correlationId]
      properties:
        code:
          type: string
          const: AUTH_CHALLENGE_REQUIRED
        message:
          type: string
        challenge:
          $ref: '#/components/schemas/Challenge'
        correlationId:
          type: string
    UserSummary:
      type: object
      required: [userId, userType, displayName, roles, privileges]
      properties:
        userId:
          $ref: '#/components/schemas/ID'
        userType:
          $ref: '#/components/schemas/UserType'
        displayName:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleCode'
        privileges:
          type: array
          items:
            $ref: '#/components/schemas/PrivilegeCode'
        customerId:
          type: [string, 'null']
          pattern: '^[1-9][0-9]{0,18}$'
    SessionInfo:
      type: object
      required: [idleExpiresAt, absoluteExpiresAt, csrfToken, deviceTrusted]
      properties:
        idleExpiresAt:
          $ref: '#/components/schemas/Instant'
        absoluteExpiresAt:
          $ref: '#/components/schemas/Instant'
        csrfToken:
          type: string
        deviceTrusted:
          type: boolean
    AuthResponse:
      type: object
      required: [user, session, correlationId]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        session:
          $ref: '#/components/schemas/SessionInfo'
        correlationId:
          type: string
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
        deviceRef:
          $ref: '#/components/schemas/UUID'
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
        deviceFingerprint:
          type: string
          minLength: 1
          maxLength: 512
    PasscodeLoginRequest:
      type: object
      additionalProperties: false
      required: [username, passcode, deviceRef, deviceFingerprint]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        passcode:
          type: string
          pattern: '^[0-9]{6,8}$'
        deviceRef:
          $ref: '#/components/schemas/UUID'
        deviceFingerprint:
          type: string
          minLength: 1
          maxLength: 512
    FidoBeginRequest:
      type: object
      additionalProperties: false
      required: [username, deviceRef]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        deviceRef:
          $ref: '#/components/schemas/UUID'
    FidoVerifyRequest:
      type: object
      additionalProperties: false
      required: [username, deviceRef, challengeId, fido]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        deviceRef:
          $ref: '#/components/schemas/UUID'
        challengeId:
          $ref: '#/components/schemas/UUID'
        fido:
          $ref: '#/components/schemas/FidoAssertion'
    FidoAssertion:
      type: object
      additionalProperties: false
      required: [credentialId, clientDataJSON, authenticatorData, signature]
      properties:
        credentialId:
          type: string
        clientDataJSON:
          type: string
        authenticatorData:
          type: string
        signature:
          type: string
        userHandle:
          type: string
    OtpVerifyRequest:
      type: object
      additionalProperties: false
      required: [challengeId, otp]
      properties:
        challengeId:
          $ref: '#/components/schemas/UUID'
        otp:
          type: string
          pattern: '^[0-9]{6,8}$'
    StepUpOtpRequest:
      type: object
      additionalProperties: false
      required: [challengeId, method, otp]
      properties:
        challengeId:
          $ref: '#/components/schemas/UUID'
        method:
          type: string
          const: OTP
        otp:
          type: string
          pattern: '^[0-9]{6,8}$'
    StepUpPasscodeRequest:
      type: object
      additionalProperties: false
      required: [challengeId, method, passcode]
      properties:
        challengeId:
          $ref: '#/components/schemas/UUID'
        method:
          type: string
          const: PASSCODE
        passcode:
          type: string
          pattern: '^[0-9]{6,8}$'
    StepUpFidoRequest:
      type: object
      additionalProperties: false
      required: [challengeId, method, fido]
      properties:
        challengeId:
          $ref: '#/components/schemas/UUID'
        method:
          type: string
          const: FIDO
        fido:
          $ref: '#/components/schemas/FidoAssertion'
    StepUpVerifyResponse:
      type: object
      required: [challengeId, status, purpose, verifiedAt, expiresAt, correlationId]
      properties:
        challengeId:
          $ref: '#/components/schemas/UUID'
        status:
          type: string
          enum: [VERIFIED]
        purpose:
          $ref: '#/components/schemas/ChallengePurpose'
        verifiedAt:
          $ref: '#/components/schemas/Instant'
        expiresAt:
          $ref: '#/components/schemas/Instant'
        correlationId:
          type: string
    CustomerSummary:
      type: object
      required: [customerId, fullName, status]
      properties:
        customerId:
          $ref: '#/components/schemas/ID'
        fullName:
          type: string
        status:
          $ref: '#/components/schemas/CustomerStatus'
    CustomerProfile:
      type: object
      required: [customerId, userId, fullName, status, createdAt, updatedAt]
      properties:
        customerId:
          $ref: '#/components/schemas/ID'
        userId:
          $ref: '#/components/schemas/ID'
        fullName:
          type: string
        phoneMasked:
          type: [string, 'null']
        emailMasked:
          type: [string, 'null']
        status:
          $ref: '#/components/schemas/CustomerStatus'
        createdAt:
          $ref: '#/components/schemas/Instant'
        updatedAt:
          $ref: '#/components/schemas/Instant'
    AccountRef:
      type: object
      required: [accountId, accountNumberMasked, accountNumberLast4]
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        accountNumberMasked:
          type: string
          pattern: '^\*{4} \*{4} [0-9]{4}$'
        accountNumberLast4:
          type: string
          pattern: '^[0-9]{4}$'
    AccountSummary:
      type: object
      required:
        - accountId
        - accountNumberMasked
        - accountNumberLast4
        - currency
        - status
        - availableBalance
        - ledgerBalance
        - asOf
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
        accountNumberMasked:
          type: string
          pattern: '^\*{4} \*{4} [0-9]{4}$'
        accountNumberLast4:
          type: string
          pattern: '^[0-9]{4}$'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/AccountStatus'
        availableBalance:
          $ref: '#/components/schemas/Money'
        ledgerBalance:
          $ref: '#/components/schemas/Money'
        asOf:
          $ref: '#/components/schemas/Instant'
    AccountDetail:
      allOf:
        - $ref: '#/components/schemas/AccountSummary'
        - type: object
          required: [owner, createdAt, updatedAt]
          properties:
            owner:
              $ref: '#/components/schemas/CustomerSummary'
            createdAt:
              $ref: '#/components/schemas/Instant'
            updatedAt:
              $ref: '#/components/schemas/Instant'
    AccountsResponse:
      type: object
      required: [items, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountSummary'
        asOf:
          $ref: '#/components/schemas/Instant'
    DestinationAccountId:
      type: object
      additionalProperties: false
      required: [accountId]
      properties:
        accountId:
          $ref: '#/components/schemas/ID'
    DestinationAccountNumber:
      type: object
      additionalProperties: false
      required: [accountNumber]
      properties:
        accountNumber:
          type: string
          pattern: '^[0-9]{6,20}$'
    Destination:
      oneOf:
        - $ref: '#/components/schemas/DestinationAccountId'
        - $ref: '#/components/schemas/DestinationAccountNumber'
    TransferCreateRequest:
      type: object
      additionalProperties: false
      required: [sourceAccountId, destination, amount]
      properties:
        sourceAccountId:
          $ref: '#/components/schemas/ID'
        destination:
          $ref: '#/components/schemas/Destination'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: [string, 'null']
          maxLength: 255
    TransferResponse:
      type: object
      required:
        - reference
        - status
        - amount
        - currency
        - sourceAccount
        - destinationAccount
        - correlationId
        - createdAt
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        status:
          $ref: '#/components/schemas/TransferStatus'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        description:
          type: [string, 'null']
        sourceAccount:
          $ref: '#/components/schemas/AccountRef'
        destinationAccount:
          $ref: '#/components/schemas/AccountRef'
        failureCode:
          type: [string, 'null']
          enum:
            - INSUFFICIENT_BALANCE
            - LIMIT_EXCEEDED
            - ACCOUNT_INACTIVE
            - ACCOUNT_NOT_FOUND
            - FRAUD_BLOCKED
            - OTP_DISPATCH_FAILED
            - AUDIT_WRITE_FAILED
            - INVALID_STATE_TRANSITION
            - PROCESSING_ERROR
            - null
        failureMessage:
          type: [string, 'null']
        correlationId:
          type: string
        createdAt:
          $ref: '#/components/schemas/Instant'
        completedAt:
          type: [string, 'null']
          format: date-time
        failedAt:
          type: [string, 'null']
          format: date-time
    FraudFlagSummary:
      type: object
      required: [flagId, ruleCode, ruleVersion, severity, status]
      properties:
        flagId:
          $ref: '#/components/schemas/ID'
        ruleCode:
          type: string
        ruleVersion:
          type: integer
        severity:
          $ref: '#/components/schemas/FraudSeverity'
        status:
          $ref: '#/components/schemas/FraudFlagStatus'
    TransferDetail:
      allOf:
        - $ref: '#/components/schemas/TransferResponse'
        - type: object
          properties:
            fraudFlags:
              type: array
              items:
                $ref: '#/components/schemas/FraudFlagSummary'
    PageMeta:
      type: object
      required: [number, size, totalElements, totalPages, first, last]
      properties:
        number:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        first:
          type: boolean
        last:
          type: boolean
    Counterparty:
      type: object
      required: [displayName, accountNumberMasked]
      properties:
        displayName:
          type: string
        accountNumberMasked:
          type: string
          pattern: '^\*{4} \*{4} [0-9]{4}$'
    TransactionItem:
      type: object
      required: [reference, direction, amount, currency, status, counterparty, createdAt]
      properties:
        reference:
          $ref: '#/components/schemas/Reference'
        direction:
          $ref: '#/components/schemas/Direction'
        amount:
          $ref: '#/components/schemas/Money'
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/TransferStatus'
        counterparty:
          $ref: '#/components/schemas/Counterparty'
        description:
          type: [string, 'null']
        createdAt:
          $ref: '#/components/schemas/Instant'
        completedAt:
          type: [string, 'null']
          format: date-time
    TransactionDetail:
      allOf:
        - $ref: '#/components/schemas/TransferResponse'
        - type: object
          required: [direction, counterparty]
          properties:
            direction:
              $ref: '#/components/schemas/Direction'
            counterparty:
              $ref: '#/components/schemas/Counterparty'
    TransactionPage:
      type: object
      required: [items, page, asOf]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TransactionItem'
        page:
          $ref: '#/components/schemas/PageMeta'
        asOf:
          $ref: '#/components/schemas/Instant'
    LimitScope:
      type: string
      enum: [CUSTOMER, ACCOUNT]
    LimitView:
      type: object
      required:
        - limitId
        - scope
        - perTransactionLimit
        - dailyLimit
        - currency
        - usedToday
        - remainingDaily
        - effectiveFrom
        - version
      properties:
        limitId:
          $ref: '#/components/schemas/ID'
        scope:
          $ref: '#/components/schemas/LimitScope'
