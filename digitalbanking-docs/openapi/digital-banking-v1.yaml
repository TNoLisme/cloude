openapi: 3.1.0
info:
  title: Digital Banking API
  version: 1.0.0
  summary: Hợp đồng API MVP cho Digital Banking
  description: >-
    Hợp đồng máy đọc được của Digital Banking MVP. Tài liệu ngữ nghĩa và quy tắc
    chi tiết nằm tại `docs-common/07. API contracts.md`. Mọi response lỗi dùng
    RFC 9457 Problem Details; tiền và ID là chuỗi; thời gian là ISO 8601 UTC.
  contact:
    name: Digital Banking Team
  license:
    name: Internal Demo
servers:
  - url: https://api.demo.local/api/v1
    description: Demo environment (Nginx TLS)
  - url: http://localhost:8080/api/v1
    description: Local backend
tags:
  - name: Auth
    description: Đăng nhập, session, OTP, FIDO và step-up
  - name: Customer
    description: Hồ sơ khách hàng
  - name: Account
    description: Tài khoản và số dư
  - name: Transfer
    description: Chuyển tiền nội bộ
  - name: Transaction
    description: Lịch sử giao dịch read-only
  - name: Limit
    description: Hạn mức và approval maker/checker
  - name: Audit
    description: Tra cứu và xuất audit
  - name: Fraud
    description: Fraud flag và review
  - name: Role
    description: Role/privilege maker/checker
  - name: Approval
    description: Approval workflow
  - name: Health
    description: Health check
security:
  - sessionCookie: []
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng password
      description: >-
        Xác thực username/password. Thiết bị tin cậy trả session; thiết bị mới
        trả 202 kèm challenge OTP. Không trả password/token trong body.
      operationId: login
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              login:
                summary: Login thiết bị mới
                value:
                  username: customer01
                  password: P@ssw0rd!
                  deviceRef: 7b5c1a2e-3d4f-4a6b-8c9d-0e1f2a3b4c5d
                  deviceName: iPhone 15
                  deviceFingerprint: opaque-device-fingerprint
      responses:
        '200':
          description: Session được tạo
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              examples:
                success:
                  $ref: '#/components/examples/LoginSuccessExample'
        '202':
          description: Cần OTP cho thiết bị mới
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeRequiredResponse'
              examples:
                challenge:
                  $ref: '#/components/examples/ChallengeRequiredExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/passcode:
    post:
      tags: [Auth]
      summary: Đăng nhập bằng passcode trên thiết bị tin cậy
      operationId: loginPasscode
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasscodeLoginRequest'
      responses:
        '200':
          description: Session được tạo
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/fido/verify:
    post:
      tags: [Auth]
      summary: Đăng nhập FIDO/WebAuthn (begin/finish)
      description: >-
        Begin: gửi username + deviceRef để nhận 202 challenge/WebAuthn options.
        Finish: gửi challengeId + fido assertion để nhận session.
      operationId: loginFido
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/FidoBeginRequest'
                - $ref: '#/components/schemas/FidoVerifyRequest'
      responses:
        '200':
          description: Session được tạo
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '202':
          description: Cần FIDO/WebAuthn challenge
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeRequiredResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Xác thực OTP thiết bị mới
      operationId: verifyOtp
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpVerifyRequest'
      responses:
        '200':
          description: Session được tạo
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/step-up/verify:
    post:
      tags: [Auth]
      summary: Xác thực step-up cho transfer hoặc hành động nhạy cảm
      operationId: verifyStepUp
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/StepUpOtpRequest'
                - $ref: '#/components/schemas/StepUpPasscodeRequest'
                - $ref: '#/components/schemas/StepUpFidoRequest'
      responses:
        '200':
          description: Challenge đã VERIFIED
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StepUpVerifyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout và vô hiệu hóa session
      operationId: logout
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Đã logout
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/session:
    get:
      tags: [Auth]
      summary: Lấy session hiện tại
      operationId: getSession
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Session hiện tại
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /auth/challenges/{challengeId}/resend:
    post:
      tags: [Auth]
      summary: Gửi lại OTP cho challenge
      description: >-
        Public cho challenge LOGIN_NEW_DEVICE; yêu cầu session cho challenge
        TRANSFER_STEP_UP/SENSITIVE_ACTION. Tối đa 3 lần resend/challenge.
      operationId: resendChallenge
      security: []
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/ChallengeIdPath'
      responses:
        '202':
          description: OTP đã gửi lại
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeRequiredResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '423':
          $ref: '#/components/responses/Locked'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /customers/me:
    get:
      tags: [Customer]
      summary: Hồ sơ customer hiện tại
      operationId: getMyProfile
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Hồ sơ customer
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /accounts:
    get:
      tags: [Account]
      summary: Danh sách tài khoản của customer
      operationId: listAccounts
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccountStatus'
      responses:
        '200':
          description: Danh sách tài khoản
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /accounts/{accountId}:
    get:
      tags: [Account]
      summary: Chi tiết tài khoản
      operationId: getAccount
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccountIdPath'
      responses:
        '200':
          description: Chi tiết tài khoản
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/customers/{customerId}:
    get:
      tags: [Customer]
      summary: Hồ sơ customer cho Operations/Admin/Auditor
      operationId: getAdminCustomer
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: Hồ sơ customer đã mask
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerProfile'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/customers/{customerId}/accounts:
    get:
      tags: [Customer, Account]
      summary: Danh sách tài khoản của customer cho staff
      operationId: getAdminCustomerAccounts
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerIdPath'
      responses:
        '200':
          description: Danh sách tài khoản
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transfers:
    post:
      tags: [Transfer]
      summary: Tạo chuyển tiền nội bộ
      description: >-
        Yêu cầu Idempotency-Key. Có thể trả 201 COMPLETED, 422 FAILED,
        428 STEP_UP_REQUIRED, 500 AUDIT_WRITE_FAILED hoặc 409 idempotency.
      operationId: createTransfer
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferCreateRequest'
            examples:
              transfer:
                summary: Chuyển tiền thường
                value:
                  sourceAccountId: '3001'
                  destination:
                    accountNumber: '0123456789'
                  amount: '150000.00'
                  currency: VND
                  description: Chuyển tiền tháng 11
      responses:
        '200':
          description: Replay kết quả cũ
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '201':
          description: Transfer COMPLETED
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
              examples:
                completed:
                  $ref: '#/components/examples/TransferCompletedExample'
        '202':
          description: Transfer PENDING (đề xuất cho xử lý bất đồng bộ)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '428':
          $ref: '#/components/responses/StepUpRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transfers/{reference}:
    get:
      tags: [Transfer]
      summary: Trạng thái/chi tiết transfer
      operationId: getTransfer
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ReferencePath'
      responses:
        '200':
          description: Chi tiết transfer
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions:
    get:
      tags: [Transaction]
      summary: Danh sách lịch sử giao dịch
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/CustomerIdQuery'
        - $ref: '#/components/parameters/AccountIdQuery'
        - $ref: '#/components/parameters/TransferStatusQuery'
        - $ref: '#/components/parameters/DirectionQuery'
        - $ref: '#/components/parameters/FromQuery'
        - $ref: '#/components/parameters/ToQuery'
        - $ref: '#/components/parameters/MinAmountQuery'
        - $ref: '#/components/parameters/MaxAmountQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: Trang lịch sử giao dịch
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /transactions/{reference}:
    get:
      tags: [Transaction]
      summary: Chi tiết giao dịch/biên nhận
      operationId: getTransaction
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/ReferencePath'
      responses:
        '200':
          description: Chi tiết giao dịch
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /limits:
    get:
      tags: [Limit]
      summary: Hạn mức hiện tại và còn lại
      operationId: getLimits
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/AccountIdQuery'
      responses:
        '200':
          description: Hạn mức của customer
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LimitsResponse'
              examples:
                limits:
                  $ref: '#/components/examples/LimitsExample'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /admin/limits:
    post:
      tags: [Limit, Approval]
      summary: Maker tạo yêu cầu thay đổi hạn mức
      description: >-
