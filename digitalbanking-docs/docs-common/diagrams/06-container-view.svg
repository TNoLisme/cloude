<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="06-container-view-title 06-container-view-desc">
  <title id="06-container-view-title">Digital Banking MVP — Container view</title>
  <desc id="06-container-view-desc">A React SPA reaches Nginx over HTTPS, which proxies API calls to the Spring Boot modular monolith; the monolith owns PostgreSQL, calls OTP, notification and FIDO simulators, and exposes metrics to Prometheus.</desc>
