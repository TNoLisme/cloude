  <line x1="700" y1="256" x2="748" y2="256" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="580" y1="208" x2="580" y2="160" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
