  <text x="244" y="245" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

  <rect x="420" y="236" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="436" y="245" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">API</text>

  <rect x="706" y="236" width="36" height="12" rx="2" fill="#f5f5f5"/>
