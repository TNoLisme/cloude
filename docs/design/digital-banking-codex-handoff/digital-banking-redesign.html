<body>
<div class="review-bar" aria-label="Điều khiển xem thiết kế">
 <div class="review-brand">Digital Banking Simulator<span>Bản thiết kế mới · Prototype tương tác</span></div>
 <div class="review-controls">
  <label for="rolePicker">Khu vực</label><select id="rolePicker"><option value="customer">Customer</option><option value="operator">Operator</option><option value="auditor">Auditor</option><option value="admin">Admin</option><option value="auth">Xác thực</option><option value="system">Trạng thái hệ thống</option><option value="design">Design system</option></select>
  <label for="screenPicker">Màn hình</label><select id="screenPicker"></select>
  <label for="devicePicker">Kích thước</label><select id="devicePicker"><option value="desktop">Desktop · 1440</option><option value="tablet">Desktop · 1024</option><option value="compact">Thu gọn · 768</option><option value="mobile">Mobile · 390</option><option value="mobile360">Mobile · 360</option></select>
  <button class="review-btn" id="demoStart">Bắt đầu luồng demo</button>
 </div>
</div>
<div class="preview-stage"><div id="app" class="app" data-device="desktop"></div></div>
<p class="review-note">Bản thiết kế dùng dữ liệu giả lập. Các thao tác bấm chỉ minh họa luồng giao diện. Hãy chọn kích thước và màn hình ở thanh phía trên để xem các trạng thái.</p>
<div id="modalRoot"></div>
<script>
(() => {
'use strict';
const app=document.getElementById('app'),rolePicker=document.getElementById('rolePicker'),screenPicker=document.getElementById('screenPicker'),devicePicker=document.getElementById('devicePicker'),modalRoot=document.getElementById('modalRoot');
const paths={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/>',transfer:'<path d="M4 7h15m-4-4 4 4-4 4M20 17H5m4-4-4 4 4 4"/>',history:'<path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-5v6l4 2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',plus:'<path d="M12 4v16M4 12h16"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m6 9 6 6 6-6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',card:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',in:'<path d="M18 6 6 18M6 8v10h10"/>',out:'<path d="M6 18 18 6M8 6h10v10"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',warning:'<path d="m12 3 10 18H2Z"/><path d="M12 9v5m0 3h.01"/>',error:'<circle cx="12" cy="12" r="9"/><path d="m8 8 8 8m0-8-8 8"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/>',mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 6 9 7 9-7"/>',phone:'<path d="M5 3h4l2 5-3 2a15 15 0 0 0 6 6l2-3 5 2v4a2 2 0 0 1-2 2A18 18 0 0 1 3 5a2 2 0 0 1 2-2Z"/>',audit:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6m-6 4h6m-6 4h4"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',empty:'<path d="M4 4h16v16H4Z"/><path d="M4 13h5l2 3h2l2-3h5"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',eye:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',key:'<circle cx="8" cy="8" r="5"/><path d="m12 12 9 9m-5-5 3-3m-6 0 3-3"/>'};
const icon=(n)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[n]||paths.info}</svg>`;
const E=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const screens={customer:[['overview','Tổng quan'],['account','Chi tiết tài khoản'],['profile','Hồ sơ cá nhân'],['pin-setup','Thiết lập PIN'],['pin-change','Đổi PIN'],['pin-forgot','Quên PIN'],['recipient','Chuyển tiền · Người nhận'],['amount','Chuyển tiền · Số tiền'],['review','Chuyển tiền · Kiểm tra'],['otp','Chuyển tiền · OTP'],['completed','Chuyển tiền · Hoàn tất'],['otp-invalid','OTP chưa đúng'],['expired','OTP hết hạn'],['failed-funds','Thất bại · Thiếu tiền'],['failed-account','Thất bại · Tài khoản'],['unknown','Chưa xác định kết quả'],['history','Lịch sử giao dịch'],['detail','Chi tiết giao dịch']],operator:[['search','Tra cứu khách hàng'],['customer-result','Kết quả tra cứu'],['topup','Nạp số dư mô phỏng'],['topup-success','Nạp số dư hoàn tất'],['create-customer','Tạo khách tại quầy'],['create-otp','Xác minh OTP khách'],['blocked','Tài khoản bị khóa'],['risk','Cờ rủi ro']],auditor:[['audit','Nhật ký audit'],['risk','Cờ rủi ro']],admin:[['audit','Nhật ký audit'],['risk','Cờ rủi ro']],auth:[['login','Đăng nhập'],['register','Đăng ký · Điện thoại'],['register-otp','Đăng ký · OTP'],['register-profile','Đăng ký · Thông tin'],['register-success','Đăng ký thành công'],['recovery','Khôi phục mật khẩu'],['recovery-otp','Khôi phục · Xác minh OTP'],['recovery-password','Khôi phục · Mật khẩu mới'],['recovery-otp-invalid','Khôi phục · OTP chưa đúng'],['recovery-otp-expired','Khôi phục · OTP hết hạn'],['recovery-session-expired','Khôi phục · Xác minh hết hiệu lực'],['recovery-success','Khôi phục thành công'],['restoring','Đang khôi phục phiên'],['session-expired','Phiên hết hạn'],['area','Chọn khu vực']],system:[['loading','Đang tải'],['empty','Trạng thái trống'],['network','Lỗi mạng'],['401','401 · Phiên hết hạn'],['403','403 · Không có quyền'],['404','404 · Không tìm thấy'],['409','409 · Dữ liệu thay đổi']],design:[['design-system','Design system']]};
const state={role:'customer',screen:'overview',device:'desktop',balance:5000000,amount:2500000,recipient:'Trần Gia Huy',message:'Chuyển tiền mô phỏng',pinSet:false,blocked:false,detailStatus:'COMPLETED',channel:'sms',recoveryVerified:false,loadedMore:false};
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫';
const btn=(text,action,kind='primary',ic='')=>`<button type="button" class="btn ${kind==='primary'?'btn-primary':kind==='danger'?'btn-danger':''}" data-action="${action}">${ic?icon(ic):''}${text}</button>`;
const link=(text,action,ic='')=>`<button type="button" class="text-btn" data-action="${action}">${text}${ic?icon(ic):''}</button>`;
const alertBox=(text,kind='info',title='')=>`<div class="alert alert-${kind}" ${kind==='error'?'role="alert"':''}>${icon(kind==='success'?'check':kind==='warn'?'warning':kind==='error'?'error':'info')}<div>${title?`<strong>${title}</strong>`:''}${text}</div></div>`;
const tag=(text,kind='success')=>`<span class="tag tag-${kind}">${icon(kind==='success'?'check':kind==='warn'?'clock':kind==='error'?(text==='BLOCKED'?'lock':'error'):'info')}${text}</span>`;
const sim=()=>`<span class="simulation">${icon('shield')}Mô phỏng — không sử dụng tiền thật</span>`;
const field=(label,id,placeholder,value='',type='text',help='',extra='')=>`<div class="field"><label for="${id}">${label}<span class="required">*</span></label><input id="${id}" name="${id}" type="${type}" placeholder="${E(placeholder)}" value="${E(value)}" ${extra}>${help?`<small>${help}</small>`:''}<div class="field-error" id="error-${id}" role="alert"></div></div>`;
const code=(label,id,help='Có thể dán mã. Bấm xác nhận để gửi.')=>field(label,id,'● ● ● ● ● ●','',label.includes('PIN')?'password':'text',help,'class="code-input" inputmode="numeric" maxlength="6" autocomplete="off"');
const security=(text)=>`<div class="security-note">${icon('shield')}<span>${text}</span></div>`;
const recipientBox=()=>`<div class="recipient"><span class="avatar">GH</span><div><strong>${state.recipient}</strong><small>Tài khoản VND · •••• 5601</small></div><span class="verified">${icon('check')}Đã xác minh</span></div>`;
const kv=(key,value)=>`<div class="kv"><dt>${key}</dt><dd>${value}</dd></div>`;
const receipt=()=>`<div class="receipt"><div class="receipt-amount"><small>Số tiền chuyển</small><strong class="num">${money(state.amount)}</strong></div><dl class="key-values">${kv('Người nhận',state.recipient)}${kv('Tài khoản nhận','•••• 5601')}${kv('Tài khoản nguồn','•••• 4821')}${kv('Lời nhắn',E(state.message))}</dl></div>`;
function go(screen,role){if(role)state.role=role;state.screen=screen;if(['login','recovery','recovery-otp','recovery-otp-invalid','recovery-otp-expired','recovery-session-expired'].includes(screen))state.recoveryVerified=false;state.loadedMore=false;modalRoot.innerHTML='';syncPickers();render();}
function syncPickers(){rolePicker.value=state.role;screenPicker.innerHTML=screens[state.role].map(([k,v])=>`<option value="${k}">${v}</option>`).join('');screenPicker.value=state.screen;devicePicker.value=state.device;}
function pageInfo(){const names=Object.fromEntries(Object.values(screens).flat());const title=names[state.screen]||'Digital Banking';const desc={overview:'Xin chào, Minh Anh. Đây là tài khoản mô phỏng của bạn.',recipient:'Xác minh người nhận trước khi nhập số tiền.',amount:'Chọn số tiền và kiểm tra thông tin giao dịch.',review:'Kiểm tra kỹ thông tin trước khi xác nhận.',history:'Theo dõi trạng thái và chi tiết từng giao dịch.',search:'Tra cứu chính xác bằng số điện thoại hoặc email.',risk:'Cảnh báo theo quy tắc · dữ liệu chỉ đọc.',audit:'Theo dõi hoạt động hệ thống · dữ liệu chỉ đọc.',profile:'Thông tin cá nhân của bạn được hiển thị ở chế độ chỉ đọc.',account:'Thông tin và trạng thái tài khoản VND.',"pin-setup":'Tạo PIN gồm 6 chữ số để xác nhận giao dịch.',"create-customer":'Xác minh điện thoại khách trước khi tạo tài khoản.'};return [title,desc[state.screen]||'Thông tin giao dịch và thao tác được trình bày theo từng bước.'];}
function navItems(){if(state.role==='customer')return [['home','Tổng quan','overview'],['transfer','Chuyển tiền','recipient'],['history','Lịch sử','history'],['user','Hồ sơ','profile']];if(state.role==='operator')return [['search','Tra cứu khách','search'],['plus','Tạo khách tại quầy','create-customer'],['warning','Cờ rủi ro','risk']];if(state.role==='design')return [['card','Design system','design-system']];return [['audit','Nhật ký audit','audit'],['warning','Cờ rủi ro','risk']];}
function activeScreen(screen){if(screen==='recipient')return ['recipient','amount','review','otp','completed','otp-invalid','expired','failed-funds','failed-account','unknown'].includes(state.screen);if(screen==='search')return ['search','customer-result','topup','topup-success','blocked'].includes(state.screen);if(screen==='profile')return ['profile','pin-setup','pin-change','pin-forgot'].includes(state.screen);if(screen==='history')return ['history','detail'].includes(state.screen);return state.screen===screen;}
function render(){app.dataset.device=state.device;const mobile=state.device.startsWith('mobile')||window.innerWidth<650;app.className='app'+(mobile?' mobile':'')+(state.device==='compact'?' compact':'');if(state.role==='auth'){app.innerHTML=authView();bindForms();return;}const [title,desc]=pageInfo(),staff=['operator','auditor','admin'].includes(state.role),roleName=state.role==='customer'?'Khách hàng':state.role==='design'?'Thiết kế':state.role==='system'?'Trạng thái':state.role[0].toUpperCase()+state.role.slice(1),nav=navItems();
app.innerHTML=`<aside class="sidebar"><div class="brand"><div class="brand-mark">DB</div><div class="brand-name">Digital Banking<small>SIMULATOR</small></div></div><div class="nav-title">${staff?'KHU VỰC NHÂN VIÊN':'NGÂN HÀNG CỦA BẠN'}</div><nav class="side-nav" aria-label="Điều hướng chính">${nav.map(([ic,text,s])=>`<button class="nav-item ${activeScreen(s)?'active':''}" data-go="${s}" ${activeScreen(s)?'aria-current="page"':''}>${icon(ic)}<span>${text}</span></button>`).join('')}</nav><div class="side-bottom"><div class="mini-icon">${icon('shield')}Môi trường mô phỏng</div><p>Chỉ sử dụng tiền VND giả lập.</p></div></aside><div class="workspace"><header class="topbar"><div class="breadcrumb">${icon('home')}<span>${roleName}</span>${icon('chevron')}<strong>${title}</strong><span class="mobile-title">${mobile?'Digital Banking':''}</span></div><div class="top-actions">${sim()}<div class="person"><div class="avatar">${staff?'NV':'MA'}</div><div><div class="person-name">${staff?'Nhân viên mô phỏng':'Nguyễn Minh Anh'}</div><div class="person-role">${roleName}</div></div></div></div></header><main class="main"><div class="content"><div class="page-title"><div><h1>${title}</h1><p>${desc}</p></div>${state.screen==='overview'?link('Chi tiết tài khoản','account','chevron'):state.screen==='customer-result'?btn('Tra cứu khác','search','default','search'):''}</div>${mobile?`<div style="margin-bottom:18px">${sim()}</div>`:''}${contentView()}</div></main>${state.role==='customer'?`<nav class="bottom-nav" aria-label="Điều hướng khách hàng">${nav.map(([ic,text,s])=>`<button class="${activeScreen(s)?'active':''}" data-go="${s}">${icon(ic)}${text}</button>`).join('')}</nav>`:''}</div>`;bindForms();}
function formPanel(title,sub,body,foot,formId=''){return `<section class="panel form-panel"><div class="panel-header"><div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}</div></div>${formId?`<form id="${formId}">`:''}<div class="form-body">${body}</div><div class="form-foot">${foot}</div>${formId?'</form>':''}</section>`;}
function submit(text,ic='arrow'){return `<button class="btn btn-primary" type="submit">${text}${ic?icon(ic):''}</button>`;}
function stepper(step){return `<div class="steps" aria-label="Bước ${step} trên 4">${['Người nhận','Số tiền','Kiểm tra','Kết quả'].map((n,i)=>`${i?'<span class="step-line"></span>':''}<div class="step ${i+1===step?'active':i+1<step?'done':''}"><span class="step-number">${i+1<step?icon('check'):i+1}</span>${n}</div>`).join('')}</div>`;}
const transactions=[{who:'Trần Gia Huy',acc:'•••• 5601',amount:-2500000,status:'COMPLETED',date:'06/10/2026',time:'10:42',note:'Chuyển tiền mô phỏng'},{who:'Lê Phương Thảo',acc:'•••• 2974',amount:250000,status:'COMPLETED',date:'06/10/2026',time:'09:42',note:'Chuyển tiền mô phỏng'},{who:'Trần Gia Huy',acc:'•••• 5601',amount:-7500000,status:'AWAITING_OTP',date:'06/10/2026',time:'09:12',note:'Đang chờ xác thực'},{who:'Nguyễn An Nhiên',acc:'•••• 6308',amount:-150000,status:'EXPIRED',date:'05/10/2026',time:'15:20',note:'Mã OTP hết hạn'},{who:'Trần Gia Huy',acc:'•••• 5601',amount:-9500000,status:'FAILED',date:'05/10/2026',time:'14:36',note:'Số dư không đủ'}];
function statusTag(status){return tag(status,status==='COMPLETED'?'success':status==='FAILED'?'error':'warn');}
function txTable(recent=false){let tx=recent?transactions.filter(x=>x.status==='COMPLETED').slice(0,2):transactions.slice(0,state.loadedMore?5:4);return `<div class="table-wrap customer-table"><table><thead><tr><th>Giao dịch / Đối ứng</th><th>Thời gian</th><th style="text-align:right">Số tiền</th><th>Trạng thái</th>${recent?'':'<th></th>'}</tr></thead><tbody>${tx.map(x=>`<tr><td><div class="direction"><span class="direction-icon ${x.amount>0?'in':''}">${icon(x.amount>0?'in':'out')}</span><div><strong>${x.who}</strong><span class="sub">${x.amount>0?'Tiền vào':'Tiền ra'} · ${x.acc}</span></div></div></td><td>${x.date}<span class="sub">${x.time}</span></td><td class="amount num ${x.amount>0?'money-in':''}">${x.amount>0?'+':'−'}${money(Math.abs(x.amount))}</td><td>${statusTag(x.status)}</td>${recent?'':`<td>${link('Chi tiết','detail:'+x.status,'chevron')}</td>`}</tr>`).join('')}</tbody></table></div><div class="mobile-list">${tx.map(x=>`<div class="mobile-transaction"><span class="direction-icon ${x.amount>0?'in':''}">${icon(x.amount>0?'in':'out')}</span><div class="tx-body"><div class="tx-top"><strong>${x.who}</strong><span class="num ${x.amount>0?'money-in':''}">${x.amount>0?'+':'−'}${money(Math.abs(x.amount))}</span></div><div class="tx-meta"><span>${x.amount>0?'Tiền vào':'Tiền ra'} · ${x.date}</span>${statusTag(x.status)}</div>${recent?'':link('Chi tiết','detail:'+x.status)}</div></div>`).join('')}</div>`;}

case 'amount':return stepper(2)+formPanel('Nhập số tiền','Người nhận đã được xác minh',`${recipientBox()}<div class="field"><label for="amount-value">Số tiền chuyển<span class="required">*</span></label><div class="input-unit"><input id="amount-value" inputmode="numeric" value="${new Intl.NumberFormat('vi-VN').format(state.amount)}" autocomplete="off"><span>₫</span></div><small>Từ 2.000 đến 10.000.000 ₫</small><div id="error-amount-value" class="field-error" role="alert"></div></div>${field('Lời nhắn','message','Nhập lời nhắn',state.message)}<div class="countdown"><span>Số dư tài khoản nguồn</span><strong style="color:var(--navy)">${money(state.balance)}</strong></div>`,`${link('Quay lại','recipient')}${submit('Kiểm tra thông tin')}`,'amount-form');

case 'history':return `<section class="panel"><div class="filters"><div class="field"><label for="status-filter">Trạng thái</label><select id="status-filter"><option>Tất cả trạng thái</option><option>COMPLETED</option><option>AWAITING_OTP</option><option>EXPIRED</option><option>FAILED</option></select></div><div class="field"><label for="time-filter">Thời gian</label><select id="time-filter"><option>30 ngày gần đây</option><option>7 ngày gần đây</option><option>Hôm nay</option></select></div>${btn('Áp dụng','filter','default','search')}</div><div id="history-rows">${txTable()}</div><div class="table-footer"><span>Hiển thị ${state.loadedMore?'5':'4'} giao dịch</span>${btn('Tải thêm','load-more','default')}</div></section>`;

case 'search':return `<section class="panel search-panel"><div class="panel-header"><div><h2>Tra cứu khách hàng</h2><p>Nhập đầy đủ và chính xác một thông tin định danh</p></div><span class="tag tag-info">${icon('search')}Tra cứu chính xác</span></div><form id="search-form" class="panel-pad"><div class="search-box">${field('Số điện thoại hoặc email','customer-query','VD: minhanh@example.test')}${submit('Tra cứu','search')}</div></form><div class="empty" style="border-top:1px solid var(--line)"><span class="empty-icon">${icon('search')}</span><h3>Sẵn sàng tra cứu</h3><p>Thông tin khách và các tài khoản sẽ hiển thị sau khi tìm kiếm.</p></div></section>`;

function resultPanel(title,sub,kind,body,actions){return `<section class="panel form-panel result"><div class="result-symbol ${kind==='success'?'':kind}">${icon(kind==='success'?'check':kind==='warn'?'clock':'error')}</div><h2>${title}</h2><p>${sub}</p><div style="margin-top:18px">${body}</div><div class="actions">${actions}</div></section>`;}

case 'register-profile':title='Thông tin tài khoản';sub='Bước 3/3 · Hoàn tất thông tin đăng nhập';body=`<form id="register-profile-form">${field('Họ và tên','register-name','Nhập họ và tên')}${field('Email','register-email','Nhập email','','email')}${field('Mật khẩu','register-password','Nhập mật khẩu','','password','','autocomplete="new-password"')}${submit('Tạo tài khoản','check')}</form>`;break;
case 'register-success':title='Tạo tài khoản thành công';sub='Tài khoản mô phỏng của bạn đã sẵn sàng.';body=`${alertBox('Vui lòng đăng nhập để tiếp tục.','success')}<div style="margin-top:22px">${btn('Đến đăng nhập','login','primary','arrow')}</div>`;break;
case 'recovery':title='Khôi phục mật khẩu';sub='Bước 1/3 · Chọn kênh nhận mã OTP xác minh.';body=`<form id="recovery-form"><div class="channel-tabs"><button type="button" class="${state.channel==='sms'?'active':''}" data-action="channel:sms">${icon('phone')} SMS</button><button type="button" class="${state.channel==='email'?'active':''}" data-action="channel:email">${icon('mail')} Email</button></div>${field(state.channel==='sms'?'Số điện thoại':'Email','recovery-identity',state.channel==='sms'?'Nhập số điện thoại':'Nhập email','',state.channel==='sms'?'tel':'email')}${submit('Yêu cầu mã OTP','arrow')}</form>`;bottom=link('Về đăng nhập','login','back');break;
case 'recovery-otp':case 'recovery-otp-invalid':case 'recovery-otp-expired':title='Xác minh mã OTP';sub='Bước 2/3 · Nhập mã OTP gồm 6 chữ số';body=`<form id="recovery-otp-form">${alertBox('Nếu thông tin đã đăng ký, mã OTP sẽ được gửi tới kênh bạn chọn')}${state.screen==='recovery-otp-invalid'?alertBox('Mã OTP chưa đúng. Vui lòng kiểm tra và nhập lại.','error'):state.screen==='recovery-otp-expired'?alertBox('Mã OTP đã hết hạn. Vui lòng yêu cầu mã mới.','warn'):''}${code('Mã OTP','recovery-code','Có thể dán mã và giữ số 0 đầu. Bấm xác minh để tiếp tục.')}${security('Sau khi mã OTP được xác minh, bạn sẽ đến bước đặt mật khẩu mới.')}${state.screen==='recovery-otp-expired'?btn('Yêu cầu mã mới','recovery'):submit('Xác minh OTP','shield')}</form>`;bottom=link('Đổi thông tin nhận mã','recovery','back');break;
case 'recovery-password':title='Đặt mật khẩu mới';sub='Bước 3/3 · Tạo mật khẩu đăng nhập mới';body=`<form id="recovery-password-form">${alertBox('Đã xác minh OTP. Bạn có thể đặt mật khẩu mới.','success')}${field('Mật khẩu mới','recovery-password','Nhập mật khẩu mới','','password','','autocomplete="new-password"')}${field('Xác nhận mật khẩu mới','recovery-confirm-password','Nhập lại mật khẩu mới','','password','','autocomplete="new-password"')}${security('Dùng mật khẩu mới để đăng nhập sau khi cập nhật thành công.')}${submit('Cập nhật mật khẩu','check')}</form>`;bottom=link('Hủy và về đăng nhập','login','back');break;
case 'recovery-session-expired':title='Xác minh đã hết hiệu lực';sub='Vui lòng xác minh lại để tiếp tục đặt mật khẩu.';body=`${alertBox('Phiên khôi phục đã hết hạn hoặc không còn hợp lệ. Hãy yêu cầu mã OTP mới.','warn')}<div style="margin-top:22px">${btn('Xác minh lại','recovery','shield')}</div>`;bottom=link('Về đăng nhập','login','back');break;
case 'recovery-success':title='Đã cập nhật mật khẩu';sub='Bạn có thể đăng nhập bằng mật khẩu mới.';body=`${alertBox('Khôi phục mật khẩu hoàn tất.','success')}<div style="margin-top:22px">${btn('Đến đăng nhập','login')}</div>`;break;
case 'restoring':title='Đang khôi phục phiên';sub='Vui lòng chờ trong giây lát.';body=`<div role="status"><div class="skeleton"></div><div class="skeleton" style="width:95%"></div><div class="skeleton" style="width:45%"></div></div><div style="margin-top:24px">${btn('Tiếp tục demo','area')}</div>`;break;
case 'session-expired':title='Phiên đăng nhập hết hạn';sub='Vui lòng đăng nhập lại để tiếp tục.';body=`${alertBox('Phiên hiện tại đã hết hạn.','warn')}<div style="margin-top:24px">${btn('Đến đăng nhập','login')}</div>`;break;
case 'area':title='Chọn khu vực làm việc';sub='Các khu vực bạn được cấp quyền truy cập.';body=`<div style="display:flex;flex-direction:column;gap:12px"><button class="area-choice" data-action="area:customer"><span class="role-avatar">${icon('user')}</span><span><strong>Khách hàng</strong><small>Tài khoản và giao dịch cá nhân</small></span>${icon('chevron')}</button><button class="area-choice" data-action="area:operator"><span class="role-avatar">${icon('audit')}</span><span><strong>Nhân viên · Operator</strong><small>Tra cứu và hỗ trợ khách tại quầy</small></span>${icon('chevron')}</button></div>`;break;
}return `<main class="auth"><div class="auth-brand"><div class="brand-mark">DB</div><div><strong>Digital Banking</strong><small>SIMULATOR · NGÂN HÀNG MÔ PHỎNG</small></div></div><section class="auth-card"><h1>${title}</h1><p class="auth-sub">${sub}</p>${body}${bottom?`<div class="auth-bottom">${bottom}</div>`:''}</section>${sim()}</main>`;}
function systemView(){const config={loading:['Đang tải dữ liệu','Vui lòng chờ trong giây lát.','info'],empty:['Chưa có giao dịch','Giao dịch hoàn tất sẽ xuất hiện tại đây.','info'],network:['Không thể kết nối','Vui lòng kiểm tra kết nối và thử lại.','error'],'401':['Phiên đã hết hạn','Đăng nhập lại để tiếp tục.','warn'],'403':['Bạn không có quyền truy cập','Khu vực này yêu cầu quyền phù hợp.','error'],'404':['Không tìm thấy nội dung','Nội dung được yêu cầu không tồn tại.','info'],'409':['Dữ liệu đã thay đổi','Tải lại dữ liệu và kiểm tra trước khi tiếp tục.','warn']};let [title,sub,kind]=config[state.screen]||config.empty;if(state.screen==='loading')return `<section class="panel form-panel panel-pad" role="status"><div class="skeleton" style="width:40%"></div><div class="skeleton large"></div><div class="skeleton" style="width:95%"></div><div class="skeleton" style="width:85%"></div><p class="small muted">Đang tải dữ liệu…</p></section>`;return resultPanel(title,sub,kind,'',state.screen==='401'?btn('Đăng nhập','auth-login'):['network','409'].includes(state.screen)?btn('Thử lại','retry','primary','history'):btn('Về tổng quan','customer-overview','default'));}
function designView(){return `<div class="ds-grid"><section class="panel ds-card ds-span"><h3>Bảng màu · Light theme</h3><div class="ds-swatches">${[['Navy','#173B5E'],['Blue','#2868B2'],['Background','#F5F7FA'],['Surface','#FFFFFF'],['Text','#223449'],['Muted','#65768A'],['Border','#E1E7EF'],['Success','#237A52'],['Warning','#9C5B0A'],['Error','#B53A3A']].map(([n,c])=>`<div class="swatch"><div class="swatch-color" style="background:${c}"></div><strong>${n}</strong><small>${c}</small></div>`).join('')}</div></section><section class="panel ds-card ds-span"><h3>Typography · Inter / Segoe UI</h3><div class="type-examples"><h1>Heading · 28</h1><h2>Section · 20</h2><h3>Title · 16</h3><span>Body · 14</span><span class="small muted">Caption · 12</span></div><p class="small muted" style="margin-top:17px">Grid 8px · spacing 8 / 16 / 24 / 32 / 40 · radius 8 / 12 · viền 1px · bóng nhẹ</p></section><section class="panel ds-card"><h3>Button · Trạng thái</h3><div class="actions">${btn('Tiếp tục','noop')}${btn('Quay lại','noop','default')}${btn('Xác nhận khóa','noop','danger')}<button class="btn" disabled>Không khả dụng</button></div></section><section class="panel ds-card"><h3>Input · Select</h3>${field('Số điện thoại','ds-phone','Nhập số điện thoại')}<div class="field" style="margin-top:18px"><label for="ds-status">Trạng thái</label><select id="ds-status"><option>Tất cả trạng thái</option><option>COMPLETED</option></select></div></section><section class="panel ds-card"><h3>Status tag · Nhãn và icon</h3><div class="chip-row">${tag('ACTIVE')}${tag('BLOCKED','error')}${statusTag('COMPLETED')}${statusTag('AWAITING_OTP')}${statusTag('EXPIRED')}${statusTag('FAILED')}</div></section><section class="panel ds-card"><h3>Notification · Lỗi trong trang</h3>${alertBox('Giao dịch đã hoàn tất.','success')}<div style="margin-top:12px">${alertBox('Chờ xác thực — tiền chưa được chuyển.','warn')}</div><div style="margin-top:12px">${alertBox('Không thể tải dữ liệu. Vui lòng thử lại.','error')}</div></section><section class="panel ds-card"><h3>Loading · Empty state</h3><div class="skeleton"></div><div class="skeleton" style="width:90%"></div><div class="empty" style="padding:22px 0 0"><span class="empty-icon">${icon('empty')}</span><h3>Chưa có giao dịch</h3><p>Giao dịch hoàn tất sẽ xuất hiện tại đây.</p></div></section><section class="panel ds-card"><h3>Confirmation dialog</h3><p class="small muted">Hành động quan trọng có bước xác nhận. Khóa / mở khóa bắt buộc nhập lý do.</p><div style="margin-top:20px">${btn('Xem dialog','block-dialog','default','lock')}</div><h3 style="margin-top:24px">Tabs</h3><div class="channel-tabs"><button class="active">SMS</button><button>Email</button></div></section><section class="panel ds-card ds-span"><h3>Steps · Chuyển tiền</h3>${stepper(2)}</section><section class="panel ds-span"><div class="panel-header"><h3>Table · Giao dịch</h3>${tag('Chỉ đọc','info')}</div>${txTable(true)}</section></div>`;}
function showModal(title,body,confirm,action,danger=false){modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><div class="modal-head">${icon('warning')}<div><h2 id="dialog-title">${title}</h2></div></div><div class="modal-body">${body}</div><div class="modal-actions">${btn('Hủy','close-dialog','default')}${btn(confirm,action,danger?'danger':'primary')}</div></section></div>`;modalRoot.querySelector('input,button')?.focus();}
function error(id,msg){const el=document.getElementById(id),out=document.getElementById('error-'+id);if(out)out.innerHTML=icon('error')+msg;el?.closest('.field')?.classList.add('invalid');el?.focus();return false;}
function requireFields(ids){for(const id of ids){const el=document.getElementById(id);if(!el||!el.value.trim())return error(id,'Vui lòng nhập thông tin.');}return true;}
function validateCode(id){let value=document.getElementById(id)?.value||'';return /^\d{6}$/.test(value)||error(id,'Mã phải gồm đúng 6 chữ số.');}
function bindForms(){const bind=(id,fn)=>{const f=document.getElementById(id);if(f)f.addEventListener('submit',e=>{e.preventDefault();fn();});};app.querySelectorAll('.code-input').forEach(input=>input.addEventListener('input',()=>{input.value=input.value.replace(/\D/g,'').slice(0,6);}));
bind('login-form',()=>{if(requireFields(['login-phone','login-password']))go('area');});bind('register-form',()=>{if(requireFields(['register-phone']))go('register-otp');});bind('register-otp-form',()=>{if(validateCode('register-otp-code'))go('register-profile');});bind('register-profile-form',()=>{if(requireFields(['register-name','register-email','register-password']))go('register-success');});bind('recovery-form',()=>{if(requireFields(['recovery-identity'])){state.recoveryVerified=false;go('recovery-otp');}});bind('recovery-otp-form',()=>{if(state.screen==='recovery-otp-expired')return;if(validateCode('recovery-code')){state.recoveryVerified=true;go('recovery-password');}});bind('recovery-password-form',()=>{if(!state.recoveryVerified){go('recovery-session-expired');return;}if(!requireFields(['recovery-password','recovery-confirm-password']))return;if(document.getElementById('recovery-password').value!==document.getElementById('recovery-confirm-password').value)return error('recovery-confirm-password','Mật khẩu xác nhận chưa trùng khớp.');state.recoveryVerified=false;go('recovery-success');});
bind('pin-form',()=>{if(state.screen!=='pin-setup'&&!validateCode('old-code'))return;if(!validateCode('new-pin')||!validateCode('confirm-pin'))return;if(document.getElementById('new-pin').value!==document.getElementById('confirm-pin').value)return error('confirm-pin','PIN xác nhận chưa trùng khớp.');state.pinSet=true;go('overview');});bind('recipient-form',()=>{if(requireFields(['recipient-account']))go('amount');});bind('amount-form',()=>{const amt=Number(document.getElementById('amount-value').value.replace(/\D/g,''));if(amt<2000||amt>10000000)return error('amount-value','Số tiền phải từ 2.000 đến 10.000.000 ₫.');state.amount=amt;state.message=document.getElementById('message').value.trim()||'Chuyển tiền mô phỏng';go('review');});bind('review-form',()=>{if(!validateCode('transfer-pin'))return;if(state.amount>5000000){go('otp');return;}if(state.blocked){go('failed-account');return;}if(state.amount>state.balance){go('failed-funds');return;}complete();});bind('otp-form',()=>{if(!validateCode('transfer-otp'))return;if(state.blocked){go('failed-account');return;}if(state.amount>state.balance){go('failed-funds');return;}complete();});bind('search-form',()=>{if(requireFields(['customer-query']))go('customer-result');});bind('topup-form',()=>{const value=Number(document.getElementById('topup-amount').value.replace(/\D/g,''));if(!value)return error('topup-amount','Vui lòng nhập số tiền hợp lệ.');state.topup=value;showModal('Xác nhận nạp số dư?',`Nạp <strong>${money(value)}</strong> vào tài khoản mô phỏng <strong>•••• 4821</strong> của Nguyễn Minh Anh.<p style="margin-top:12px">Số dư chỉ cập nhật sau khi được xác nhận.</p>`,'Xác nhận nạp','confirm-topup');});bind('create-form',()=>{if(requireFields(['new-phone','new-email','new-name','new-password']))go('create-otp');});bind('create-otp-form',()=>{if(validateCode('create-otp-value'))showModal('Tạo tài khoản khách?',`Điện thoại khách đã được xác minh bằng OTP. Xác nhận tạo tài khoản mô phỏng.`,'Tạo tài khoản','confirm-create');});}
function complete(){state.balance-=state.amount;go('completed');}
function onAction(action){if(action==='noop')return;if(action==='close-dialog'){modalRoot.innerHTML='';return;}if(action==='confirm-topup'){state.balance+=state.topup||2000000;go('topup-success');return;}if(action==='confirm-create'){go('search');return;}if(action==='block-dialog'){const unlock=state.blocked||state.screen==='blocked';showModal(unlock?'Mở khóa tài khoản?':'Khóa tài khoản?',`Tài khoản VND · •••• 4821${field('Lý do bắt buộc','account-reason','Nhập lý do')}`,unlock?'Xác nhận mở khóa':'Xác nhận khóa','confirm-block',!unlock);return;}if(action==='confirm-block'){if(!requireFields(['account-reason']))return;state.blocked=!(state.blocked||state.screen==='blocked');go(state.blocked?'blocked':'customer-result');return;}if(action==='load-more'){state.loadedMore=true;render();return;}if(action==='filter'){const selected=document.getElementById('status-filter').value;const rows=document.getElementById('history-rows');rows.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=selected!=='Tất cả trạng thái'&&!tr.textContent.includes(selected));rows.querySelectorAll('.mobile-transaction').forEach(tr=>tr.hidden=selected!=='Tất cả trạng thái'&&!tr.textContent.includes(selected));return;}if(action==='staff-filter'){const selected=document.getElementById('rule-filter').value;app.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=!selected.startsWith('Tất cả')&&!tr.textContent.includes(selected));return;}if(action.startsWith('channel:')){state.channel=action.split(':')[1];render();return;}if(action.startsWith('area:')){const role=action.split(':')[1];go(role==='customer'?(state.pinSet?'overview':'pin-setup'):'search',role);return;}if(action.startsWith('detail:')){state.detailStatus=action.split(':')[1];go('detail','customer');return;}if(action==='auth-login'){go('login','auth');return;}if(action==='customer-overview'){go('overview','customer');return;}if(action==='retry'){go('loading','system');return;}go(action);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action],[data-go]');if(!el)return;onAction(el.dataset.action||el.dataset.go);});document.addEventListener('keydown',e=>{if(e.key==='Escape')modalRoot.innerHTML='';if(e.key==='Tab'&&modalRoot.firstElementChild){const focus=[...modalRoot.querySelectorAll('button,input,select,textarea')];let first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
rolePicker.addEventListener('change',()=>go(screens[rolePicker.value][0][0],rolePicker.value));screenPicker.addEventListener('change',()=>go(screenPicker.value));devicePicker.addEventListener('change',()=>{state.device=devicePicker.value;render();});document.getElementById('demoStart').addEventListener('click',()=>{state.pinSet=false;state.balance=5000000;state.blocked=false;go('register','auth');});window.addEventListener('resize',render);
const previewParams=new URLSearchParams(location.search);
const previewRole=previewParams.get('role'),previewScreen=previewParams.get('screen'),previewDevice=previewParams.get('device');
if(previewRole&&screens[previewRole])state.role=previewRole;
if(previewScreen&&screens[state.role].some(([key])=>key===previewScreen))state.screen=previewScreen;
if(previewDevice&&['desktop','tablet','compact','mobile','mobile360'].includes(previewDevice))state.device=previewDevice;
window.bankingDesign={state,screens,go,render,icon};syncPickers();render();
})();
</script>
</body>
</html>
